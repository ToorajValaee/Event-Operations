<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Abstract Booth / Event Canopy Graphic -->
  <g transform="translate(256, 256)">
    <!-- Event Pavilion Roof Polygon -->
    <path d="M-140 -20 L0 -140 L140 -20 L100 -20 L0 -100 L-100 -20 Z" fill="url(#accentGrad)" />
    
    <!-- Pavilion Pillars & Stage -->
    <rect x="-110" y="-10" width="24" height="130" rx="6" fill="#64748b" opacity="0.8" />
    <rect x="86" y="-10" width="24" height="130" rx="6" fill="#64748b" opacity="0.8" />
    <rect x="-14" y="-30" width="28" height="150" rx="6" fill="#94a3b8" />

    <!-- Booth Base / Platform -->
    <path d="M-150 110 L150 110 L120 150 L-120 150 Z" fill="#334155" />
    <line x1="-150" y1="110" x2="150" y2="110" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Star Badge for Vendor Rating -->
    <g transform="translate(0, 10)">
      <polygon points="0,-32 10,-10 32,-10 14,4 20,26 0,13 -20,26 -14,4 -32,-10 -10,-10" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
