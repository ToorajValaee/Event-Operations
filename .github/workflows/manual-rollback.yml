name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [production]
      image_sha:
        description: Full 40-character Git commit SHA of a previously published image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eventops-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, linux, x64, eventops-deploy]
    environment: production
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Validate rollback request
        shell: bash
        env:
          SHA: ${{ inputs.image_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || exit 1
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Expected 40-character SHA" >&2; exit 1; }
          test -r /opt/event-operations/production/release.sh
          docker compose version

      - name: Restore previously published image
        shell: bash
        env:
          SHA: ${{ inputs.image_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          IMAGE="ghcr.io/toorajvalaee/event-operations:${SHA,,}"
          bash /opt/event-operations/production/release.sh "$IMAGE" production
