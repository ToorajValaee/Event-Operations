name: Manual Build and Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventops-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require main branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$SOURCE_REF" = refs/heads/main || {
            echo "Only main can publish the deployable latest tag" >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit tag plus latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/toorajvalaee/event-operations:${{ github.sha }}
            ghcr.io/toorajvalaee/event-operations:latest
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
