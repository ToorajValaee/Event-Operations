name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [production]
      build_only:
        description: Build and publish the image without deploying
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eventops-production
  cancel-in-progress: false

jobs:
  build:
    # All source checkout, npm commands, and container builds run on GitHub-hosted infrastructure.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check source branch
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || {
            echo "Production images must be built from main" >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - name: Type-check
        run: npm run lint

      - name: Set immutable image tag
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ !inputs.build_only }}
    needs: build
    # Dedicated label: do not run source checkout or third-party Actions on this host.
    runs-on: [self-hosted, linux, x64, eventops-deploy]
    environment: production
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Validate job context and installed tools
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          WORKFLOW_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || exit 1
          [[ "$REPOSITORY" == "ToorajValaee/Event-Operations" ]] || exit 1
          [[ "$IMAGE" =~ ^ghcr\.io/toorajvalaee/event-operations:[0-9a-f]{40}$ ]] || exit 1
          command -v docker
          command -v flock
          docker compose version
          test -r /opt/event-operations/production/.env.prod
          test -r /opt/event-operations/production/stack.env
          test -r /opt/event-operations/production/compose.yml
          test -r /opt/event-operations/production/release.sh
          echo "VPS runner preflight passed"

      - name: Authenticate to GHCR using temporary credentials
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          # Authenticate and pull on the runner; the release script pulls again using the
          # preconfigured VPS Docker credential store. Install a read-only GHCR login once
          # for the deploy user on the VPS before the first deployment.
          docker pull "ghcr.io/toorajvalaee/event-operations:${GITHUB_SHA,,}"

      - name: Deploy and verify application health
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -Eeuo pipefail
          bash /opt/event-operations/production/release.sh "$IMAGE" production
