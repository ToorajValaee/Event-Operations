name: Manual Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target VPS environment
        required: true
        type: choice
        options: [staging, production]
      build_only:
        description: Build and publish image without connecting to VPS
        required: true
        type: boolean
        default: true
      ref_to_deploy:
        description: Git branch, tag, or commit to build (default main)
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: eventops-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_deploy }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Set image tag
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ !inputs.build_only }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Upload deployment configuration
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          PORT="${PORT:-22}"
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p /opt/event-operations/$ENVIRONMENT"
          scp -P "$PORT" deploy/compose.yml deploy/release.sh "$USER@$HOST:/opt/event-operations/$ENVIRONMENT/"
      - name: Login on VPS to GHCR
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          PORT="${PORT:-22}"
          printf '%s' "$GHCR_READ_TOKEN" | ssh -p "$PORT" "$USER@$HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
      - name: Deploy and verify health (automatic app rollback on failure)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          PORT="${PORT:-22}"
          ssh -p "$PORT" "$USER@$HOST" "bash /opt/event-operations/$ENVIRONMENT/release.sh '$IMAGE' '$ENVIRONMENT'"
