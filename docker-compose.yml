services:
  # =========================================================
  # 1. Main Application Service (Vite + Express Backend)
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventops_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://eventops_user:eventops_password@postgres:5432/eventops_db
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=eventops-uploads
      - MINIO_PUBLIC_URL=http://localhost:9000
      - SMS_IR_API_KEY=${SMS_IR_API_KEY:-}
      - SMS_IR_TEMPLATE_ID=${SMS_IR_TEMPLATE_ID:-}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - eventops_network

  # =========================================================
  # 2. PostgreSQL Relational Database (Profiles & Event Data)
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: eventops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventops_user
      POSTGRES_PASSWORD: eventops_password
      POSTGRES_DB: eventops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventops_user -d eventops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventops_network

  # =========================================================
  # 3. Redis Cache & Session Store
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: eventops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventops_network

  # =========================================================
  # 4. MinIO S3 Object Storage (Logos, Documents & Contracts)
  # =========================================================
  minio:
    image: minio/minio:latest
    container_name: eventops_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventops_network

  # =========================================================
  # 5. MinIO Bucket Initialization Helper
  # =========================================================
  minio_init:
    image: minio/mc:latest
    container_name: eventops_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/eventops-uploads --ignore-existing;
      /usr/bin/mc anonymous set download myminio/eventops-uploads;
      exit 0;
      "
    networks:
      - eventops_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  eventops_network:
    driver: bridge
